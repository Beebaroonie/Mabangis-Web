<style>
  .frag-spacer { height: 80px; }
  .frag-heading { color: #FFD700; font-size: 1.4rem; letter-spacing: 4px; text-transform: uppercase; margin-bottom: 6px; text-align: center; font-family: "Marcellus SC", serif; }
  .frag-sub { color: rgba(255,255,255,0.6); font-size: 0.75rem; letter-spacing: 2px; text-align: center; margin-bottom: 24px; font-family: "Marcellus SC", serif; }
  .frag-card { background: #000; border: 2px solid #000; box-shadow: inset 0 0 0 3px #000, inset 0 0 0 5px #FFD700; color: #fff; padding: 16px 18px; margin-bottom: 14px; font-family: "Marcellus SC", serif; font-size: 0.9rem; line-height: 1.7; }
  .frag-card-title { color: #FFD700; font-size: 0.95rem; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 8px; }
  .no-events { color: rgba(255,255,255,0.5); text-align: center; font-family: "Marcellus SC", serif; }
  .frag-spacer-bottom { height: 60px; }
</style>
<div class="frag-spacer"></div>
<div class="frag-heading">Calendar</div>
<div class="frag-sub">Upcoming Sessions</div>
<div id="cal-events"></div>
<div class="frag-spacer-bottom"></div>
<script>
(async function() {
  const calId = encodeURIComponent("elitefilipinomaharlika@gmail.com");
  const apiKey = "AIzaSyBhXauMDPLGmn8xuyayLN8kZ-_fb8tCC-c";
  const now = new Date().toISOString();
  const url = "https://www.googleapis.com/calendar/v3/calendars/" + calId + "/events?key=" + apiKey + "&timeMin=" + now + "&maxResults=10&singleEvents=true&orderBy=startTime";
  const container = document.getElementById("cal-events");
  try {
    const res = await fetch(url);
    const data = await res.json();
    if (!data.items || data.items.length === 0) {
      container.innerHTML = "<p class=no-events>No upcoming sessions scheduled.</p>";
      return;
    }
    data.items.forEach(function(event) {
      const title = event.summary || "Untitled";
      const start = event.start.dateTime || event.start.date;
      const date = new Date(start).toLocaleString("en-US", {weekday:"long", month:"long", day:"numeric", hour:"2-digit", minute:"2-digit"});
      container.innerHTML += "<div class=frag-card><div class=frag-card-title>" + title + "</div>" + date + "</div>";
    });
  } catch(e) {
    container.innerHTML = "<p class=no-events>Could not load events.</p>";
  }
})();
</script>
