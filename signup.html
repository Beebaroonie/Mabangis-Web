<style>
  .frag-spacer { height: 80px; }
  .frag-heading { color: #FFD700; font-size: 1.4rem; letter-spacing: 4px; text-transform: uppercase; margin-bottom: 6px; text-align: center; font-family: 'Marcellus SC', serif; }
  .frag-sub { color: rgba(255,255,255,0.6); font-size: 0.75rem; letter-spacing: 2px; text-align: center; margin-bottom: 24px; font-family: 'Marcellus SC', serif; }
  .signup-option-btn { display: block; width: 100%; background: #000; border: 2px solid #000; box-shadow: inset 0 0 0 3px #000, inset 0 0 0 5px #FFD700; color: #FFD700; font-family: 'Marcellus SC', serif; font-size: 1rem; letter-spacing: 3px; text-transform: uppercase; padding: 18px; margin-bottom: 14px; cursor: pointer; transition: background 0.2s ease; text-align: center; }
  .signup-option-btn:hover { background: rgba(255,215,0,0.08); }
  .frag-spacer-bottom { height: 60px; }

  .training-modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 1000; justify-content: center; align-items: flex-start; overflow-y: auto; padding: 30px 16px; }
  .training-modal-overlay.open { display: flex; }
  .training-modal-box { background: #0a0a0a; border: 2px solid #000; box-shadow: inset 0 0 0 2px #000, inset 0 0 0 4px #FFD700, 0 0 30px rgba(255,215,0,0.15); max-width: 420px; width: 100%; padding: 28px 22px; position: relative; }
  .training-modal-close { position: absolute; top: 10px; right: 14px; color: #FFD700; font-size: 1.4rem; cursor: pointer; font-family: 'Marcellus SC', serif; background: none; border: none; }
  .training-modal-title { color: #FFD700; font-size: 1.2rem; letter-spacing: 3px; text-transform: uppercase; text-align: center; margin-bottom: 20px; font-family: 'Marcellus SC', serif; }
  .training-field-label { color: #FFD700; font-size: 0.7rem; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 4px; margin-top: 14px; display: block; font-family: 'Marcellus SC', serif; }
  .training-field-input, .training-field-select, .training-field-textarea { width: 100%; background: #000; border: 1px solid #FFD700; color: #fff; padding: 10px; font-size: 0.9rem; font-family: inherit; box-sizing: border-box; }
  .training-field-textarea { resize: vertical; min-height: 60px; }
  .training-submit-btn { display: block; width: 100%; background: linear-gradient(90deg, #cc0000, #0033cc); border: 2px solid #000; box-shadow: inset 0 0 0 2px #000, inset 0 0 0 4px #FFD700; color: #FFD700; font-family: 'Marcellus SC', serif; font-size: 1rem; letter-spacing: 3px; text-transform: uppercase; padding: 14px; margin-top: 22px; cursor: pointer; }
  .training-status-msg { text-align: center; margin-top: 14px; font-size: 0.85rem; color: #FFD700; font-family: 'Marcellus SC', serif; }
</style>

<div class="frag-spacer"></div>
<div class="frag-heading">Sign Up</div>
<div class="frag-sub">Choose Your Path</div>

<button class="signup-option-btn" onclick="document.getElementById('trainingModal').classList.add('open')">1 on 1 Training</button>

<div class="frag-spacer-bottom"></div>

<div class="training-modal-overlay" id="trainingModal">
  <div class="training-modal-box">
    <button class="training-modal-close" onclick="document.getElementById('trainingModal').classList.remove('open')">&times;</button>
    <div class="training-modal-title">1 on 1 Training Signup</div>
    <form id="trainingForm">
      <label class="training-field-label">Full Name</label>
      <input class="training-field-input" type="text" id="t-name" required>

      <label class="training-field-label">Age</label>
      <input class="training-field-input" type="number" id="t-age" required>

      <label class="training-field-label">Phone Number</label>
      <input class="training-field-input" type="tel" id="t-phone" required>

      <label class="training-field-label">Email</label>
      <input class="training-field-input" type="email" id="t-email" required>

      <label class="training-field-label">Prior Martial Arts Experience</label>
      <select class="training-field-select" id="t-experience">
        <option value="None">None</option>
        <option value="Some">Some</option>
        <option value="Experienced">Experienced</option>
      </select>

      <label class="training-field-label">Specific Interest</label>
      <select class="training-field-select" id="t-interest">
        <option value="Mabangis">Mabangis</option>
        <option value="FMA-Arnis">FMA / Arnis</option>
        <option value="Boxing">Boxing</option>
        <option value="Muay Thai">Muay Thai</option>
        <option value="General Fitness">General Fitness</option>
      </select>

      <label class="training-field-label">Preferred Days / Times</label>
      <input class="training-field-input" type="text" id="t-days">

      <label class="training-field-label">Goals</label>
      <textarea class="training-field-textarea" id="t-goals"></textarea>

      <label class="training-field-label">Injuries / Conditions / Limitations</label>
      <textarea class="training-field-textarea" id="t-medical"></textarea>

      <label class="training-field-label">Emergency Contact Name</label>
      <input class="training-field-input" type="text" id="t-ecname">

      <label class="training-field-label">Emergency Contact Phone</label>
      <input class="training-field-input" type="tel" id="t-ecphone">

      <button type="submit" class="training-submit-btn">Submit</button>
      <div class="training-status-msg" id="trainingStatus"></div>
    </form>
  </div>
</div>

<script>
document.getElementById("trainingForm").addEventListener("submit", function(e) {
  e.preventDefault();
  var statusEl = document.getElementById("trainingStatus");
  statusEl.textContent = "Submitting...";

  var payload = {
    name: document.getElementById("t-name").value,
    age: document.getElementById("t-age").value,
    phone: document.getElementById("t-phone").value,
    email: document.getElementById("t-email").value,
    experience: document.getElementById("t-experience").value,
    interest: document.getElementById("t-interest").value,
    days: document.getElementById("t-days").value,
    goals: document.getElementById("t-goals").value,
    medical: document.getElementById("t-medical").value,
    emergencyName: document.getElementById("t-ecname").value,
    emergencyPhone: document.getElementById("t-ecphone").value
  };

  fetch("https://script.google.com/macros/s/AKfycbwA_J7Njzk8n-YqxArPnWVFV61SWvCHCzUmjWBXu3m8JY8KOGDZ7TIIe6zdbYH_l-W9/exec", {
    method: "POST",
    mode: "no-cors",
    headers: { "Content-Type": "text/plain;charset=utf-8" },
    body: JSON.stringify(payload)
  }).then(function() {
    statusEl.textContent = "Thank you! We will contact you soon.";
    document.getElementById("trainingForm").reset();
    setTimeout(function() {
      document.getElementById("trainingModal").classList.remove("open");
      statusEl.textContent = "";
    }, 2500);
  }).catch(function() {
    statusEl.textContent = "Something went wrong. Please try again.";
  });
});
</script>
